server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: user-management-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO
    com.example.usermanagement: DEBUG
